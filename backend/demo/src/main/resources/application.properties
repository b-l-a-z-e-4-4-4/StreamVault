spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=streamvault

server.port=${PORT:8080}

app.otp.email.from=${APP_OTP_EMAIL_FROM:onboarding@resend.dev}
app.admin.email=${ADMIN_EMAIL:admin@example.com}

# Secure cookies for the Vercel frontend and Render API
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.max-age=30d
server.servlet.session.timeout=30d

# Avoid excessively detailed security logs in production
logging.level.org.springframework.security=
logging.level.org.springframework.security=DEBUG